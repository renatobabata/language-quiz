[project]
name = "language-quiz"
version = "0.1.0"
description = "AI-powered language study exercise generator"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
# B008: flags function calls in argument defaults. This is a false positive
# for FastAPI's `Depends(...)` pattern, which is the framework's documented,
# idiomatic way to declare dependencies and is evaluated specially by FastAPI
# (not on every call, as the rule assumes for general Python code).
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
