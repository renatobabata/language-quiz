name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # provenance/sbom disabled: BuildKit's own SBOM attestation was found
        # to cause Trivy to report stale/ghost dependency versions in a
        # previous project (confirmed via file-by-file image inspection)
        run: docker build --provenance=false --sbom=false -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Vulnerability scan (Trivy)
        # Pinned by commit SHA, not a mutable version tag: in March 2026,
        # attackers force-pushed malicious commits onto 75 of 76 version tags
        # of this action (tags 0.0.1-0.34.2), turning trusted version
        # references into an infostealer delivery mechanism. Pinning by SHA
        # means the exact commit is verified regardless of what any tag
        # currently points to. Safe version: v0.35.0.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, verified safe commit per GHSA-69fq-xp46-6x23
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          # Skips CVEs with no fixed version available yet (OS packages
          # waiting on an upstream patch) — see docs/adr for the reasoning.
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Push image
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@SEU_SHA_DO_PASSO_7 # v1.2.2
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/language-quiz
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
